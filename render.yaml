services:
  - type: web
    name: securevault-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: securevault-postgres
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: securevault-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: securevault-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: AES_SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: VERIFICATION_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: securevault-postgres
    databaseName: securevault_db
    user: postgres
    plan: free
